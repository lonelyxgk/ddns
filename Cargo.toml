[package]
name = "ddns"
version = "1.0.1"
description = "A lightweight DDNS"
license-file = "LICENSE"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
http = "1.4.2"
once_cell = "1.21.4"
rand = "0.10.1"
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread", "signal"] }
toml = { version = "1.1.2", features = ["preserve_order"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
validator = { version = "0.20.0", features = ["derive"] }

[dev-dependencies]
reqwest = { version = "0.13.4", features = ["blocking"] }

[profile.dev]
codegen-units = 256

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

